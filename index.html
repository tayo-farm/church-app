<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">

<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg">
<style>
:root{--p:#7c3aed;--g:#fbbf24;--bg:#0f0b1e;--c:#1b1535;--t:#f4f1ff;--pk:#ff4d8d;--cy:#22d3ee}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
input,textarea{user-select:text}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;background:var(--bg);color:var(--t);font-family:system-ui,"Segoe UI",Tahoma,sans-serif}
#app{display:flex;flex-direction:column;height:100%}
header{background:linear-gradient(120deg,#7c3aed,#ff4d8d);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 14px;display:flex;align-items:center;gap:10px;border-radius:0 0 22px 22px}
header b{font-size:18px;flex:1}header span{font-size:22px}
main{flex:1;overflow-y:auto;padding:14px;overscroll-behavior:none}
nav{display:flex;background:#181230;border-top:1px solid #2d2450;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:8px 0;font-size:10.5px;color:#8f86b8;font-family:inherit}
nav button i{display:block;font-style:normal;font-size:21px}nav button.on{color:var(--g);font-weight:700}
.card{background:var(--c);border-radius:18px;padding:14px;margin-bottom:12px;border:1px solid #2d2450}
.hero{background:linear-gradient(135deg,#7c3aed,#ff4d8d);color:#fff;border:0}
.hero small{opacity:.9}.hero h2{margin:4px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{background:var(--c);border-radius:18px;padding:16px 8px;text-align:center;border:1px solid #2d2450;font-family:inherit;font-size:14px;color:var(--t)}
.tile:active{transform:scale(.96);background:#271e4a}
.tile i{display:block;font-style:normal;font-size:30px;margin-bottom:4px}
h3{margin:4px 0 10px;color:var(--cy)}
input,textarea,select{width:100%;padding:11px;border:1px solid #3b2f66;border-radius:12px;font-size:16px;font-family:inherit;margin-bottom:8px;background:#120d27;color:var(--t)}
.btn{background:linear-gradient(120deg,#7c3aed,#ff4d8d);color:#fff;border:0;border-radius:12px;padding:11px 16px;font-size:15px;font-family:inherit}
.btn.g{background:var(--g);color:#1b1535}.btn.s{padding:6px 10px;font-size:13px}
.row{display:flex;align-items:center;gap:8px}.row>*{flex:0 0 auto}.row .f{flex:1}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}
.chip{border:1px solid var(--cy);color:var(--cy);background:none;border-radius:20px;padding:5px 12px;font-size:13px;white-space:nowrap;font-family:inherit}
.chip.on{background:var(--cy);color:#0f0b1e}
.item{background:var(--c);border-radius:14px;padding:12px;margin-bottom:8px;border:1px solid #2d2450}
.item small{color:#a79fd0;display:block}
.txt{line-height:2;font-size:18px}
.resp{color:var(--g);font-weight:700}
.tag{font-size:11px;background:#2d2450;color:var(--cy);border-radius:8px;padding:2px 7px}
.note{font-size:12px;color:#8f86b8;text-align:center;margin:10px 0}
.hdrc{background:linear-gradient(135deg,#7c3aed,#ff4d8d);color:#fff;border-radius:0 0 26px 26px;margin:-14px -14px 14px;padding:18px 18px 22px}
.hdrc h1{margin:2px 0;font-size:30px}.hdrc small{opacity:.9}
.chipw{display:inline-block;background:#ffffff30;border-radius:20px;padding:4px 12px;font-size:13px;margin-top:8px}
.seg{display:flex;background:var(--c);border-radius:14px;padding:4px;margin-bottom:12px}.seg button{flex:1;border:0;background:none;color:#a79fd0;padding:10px;border-radius:11px;font-family:inherit;font-size:15px}.seg button.on{background:var(--g);color:#1b1535;font-weight:700}
.bk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.bk div{background:var(--c);border:1px solid #2d2450;border-radius:14px;padding:12px 4px;text-align:center;font-size:14px}.bk small{display:block;color:#a79fd0;font-size:11px}
.bar{height:8px;background:#2d2450;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cy),var(--pk))}
.sec{color:var(--g);margin:14px 0 8px;font-weight:700}
.ico{width:44px;height:44px;border-radius:12px;background:#2d2450;display:flex;align-items:center;justify-content:center;font-size:22px}
</style></head><body><div id="app">

 if(v==='newk')b=cls.length?`<input id="kn" placeholder="اسم المخدوم"><input id="kp" type="tel" placeholder="رقم الموبايل (اختياري)"><input id="kq" type="tel" placeholder="رقم ولي الأمر"><input id="kf" placeholder="أب الاعتراف"><input id="kb" type="date"><small>تاريخ الميلاد</small>${svSel()}<button class="btn" onclick="const n=$('#kn').value.trim();if(!n)return;const k=L('kids',[]);k.push({id:uid(),n,ph:$('#kp').value.trim(),pph:$('#kq').value.trim(),conf:$('#kf').value.trim(),pts:0,bd:$('#kb').value,cls:st.cl});S('kids',k);st.sv='list';render()">حفظ المخدوم</button>`:'<p class="note">ضيف فصل الأول</p>';
 if(v==='list'){b=svSel()+kids.filter(k=>k.cls===st.cl).map(k=>`<div class="item"><div class="row"><span class="f"><b>${esc(k.n)}</b><small>${k.ph?'📞 '+esc(k.ph):''} ${k.pph?'👪 '+esc(k.pph):''} ${k.bd?'🎂 '+k.bd:''}</small>${k.conf?`<small>أب الاعتراف: ${esc(k.conf)}</small>`:''}</span>${k.ph?`<a class="btn s" style="text-decoration:none" href="tel:${esc(k.ph)}">اتصل</a>`:''}</div><div class="row" style="margin-top:6px"><span class="tag">⭐ ${AR(k.pts||0)} نقطة</span><button class="btn s" onclick="pt('${k.id}',5)">+٥</button><button class="btn s" onclick="pt('${k.id}',-5)">-٥</button><span class="f"></span><button class="btn s g" onclick="delK('${k.id}')">حذف</button></div></div>`).join('')}
 if(v==='att'){const t=today(),A=(L('att2',{})[t]||{});b=svSel()+`<small>${t}</small>`+kids.filter(k=>k.cls===st.cl).map(k=>`<div class="item row"><span class="f">${esc(k.n)}</span><button class="btn s ${A[k.id]?'':'g'}" onclick="tgA('${k.id}')">${A[k.id]?'حاضر':'غايب'}</button></div>`).join('')||'';}
 if(v==='fu'){const t=today(),A=(L('att2',{})[t]||{}),F=L('fu',{});b=svSel()+'<p class="note">الغايبين النهاردة</p>'+kids.filter(k=>k.cls===st.cl&&!A[k.id]).map(k=>`<div class="item"><div class="row"><span class="f"><b>${esc(k.n)}</b></span>${k.ph?`<a class="btn s" style="text-decoration:none" href="tel:${esc(k.ph)}">اتصل</a>`:''}</div>${(F[k.id]||[]).slice(0,2).map(n=>`<small>${n[0]}: ${esc(n[1])}</small>`).join('')}<input id="n_${k.id}" placeholder="ملاحظة افتقاد"><button class="btn s" onclick="addF('${k.id}')">حفظ الملاحظة</button></div>`).join('')}
 if(v==='reqs'){const r=L('reqs',[]);b=r.filter(x=>x.st==='p').map(x=>`<div class="item"><b>${esc(x.n)}</b><small>طالب الانضمام لفصل: ${esc((cls.find(c=>c.id===x.cls)||{n:'؟'}).n)}</small><div class="row"><button class="btn s" onclick="rq('${x.id}',1)">قبول</button><button class="btn s g" onclick="rq('${x.id}',0)">رفض</button></div></div>`).join('')||'<p class="note">مفيش طلبات</p>'}
 if(v==='join')b=cls.length?`<input id="jn" placeholder="اسمك"><input id="jp" type="tel" placeholder="موبايلك">${svSel()}<button class="btn" onclick="const n=$('#jn').value.trim();if(!n)return;const r=L('reqs',[]);r.push({id:uid(),n,cls:st.cl,ph:$('#jp').value,st:'p'});S('reqs',r);st.sv=null;render()">إرسال الطلب</button><p class="note">في النموذج الطلب بيوصل لنفس الموبايل. الربط بين الخدام محتاج سيرفر.</p>`:'<p class="note">ضيف فصل الأول</p>';
 if(v==='bd'){const n=new Date(),m=kids.filter(k=>k.bd).map(k=>{const d=new Date(k.bd);let nx=new Date(n.getFullYear(),d.getMonth(),d.getDate());if(nx<new Date(n.getFullYear(),n.getMonth(),n.getDate()))nx=new Date(n.getFullYear()+1,d.getMonth(),d.getDate());return {k,days:Math.round((nx-n)/864e5)+1}}).sort((a,b)=>a.days-b.days);b=m.map(x=>`<div class="item row"><span class="f">${esc(x.k.n)}</span><span class="tag">${x.days<=1?'النهاردة':'بعد '+AR(x.days)+' يوم'}</span></div>`).join('')||'<p class="note">ضيف تواريخ ميلاد المخدومين</p>'}
 $('#m').innerHTML=`<div class="row"><button class="btn s" onclick="st.sv=null;render()">رجوع</button><h3 class="f">${T}</h3></div>`+b}
function delC(id){if(!confirm('حذف الفصل وكل مخدوميه؟'))return;S('cls',L('cls',[]).filter(c=>c.id!==id));S('kids',L('kids',[]).filter(k=>k.cls!==id));render()}
function pt(id,n){const k=L('kids',[]);const x=k.find(y=>y.id===id);x.pts=Math.max(0,(x.pts||0)+n);S('kids',k);render()}
function delK(id){S('kids',L('kids',[]).filter(k=>k.id!==id));render()}
function tgA(id){const a=L('att2',{});const t=today();a[t]=a[t]||{};a[t][id]=!a[t][id];S('att2',a);render()}
function addF(id){const v=$('#n_'+id).value.trim();if(!v)return;const f=L('fu',{});f[id]=f[id]||[];f[id].unshift([today(),v]);S('fu',f);render()}
function rq(id,ok){const r=L('reqs',[]);const x=r.find(y=>y.id===id);if(ok){const k=L('kids',[]);k.push({id:uid(),n:x.n,ph:x.ph||'',bd:'',cls:x.cls});S('kids',k)}x.st=ok?'a':'r';S('reqs',r);render()}
function doImport(){try{const h=location.hash;if(!h.startsWith('#imp='))return;const d=JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(h.slice(5))))));const cl=L('cls',[]);const kd=L('kids',[]);let c=cl.find(x=>x.n===d.cls);if(!c){c={id:uid(),n:d.cls};cl.push(c)}let n=0;d.kids.forEach(k=>{if(!kd.find(x=>x.n===k.n&&x.ph===k.ph)){kd.push({id:uid(),cls:c.id,...k});n++}});S('cls',cl);S('kids',kd);history.replaceState(null,'',location.pathname+location.search);alert('تم استيراد '+n+' مخدوم على موبايلك فقط');}catch(e){}}
doImport();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
render();
</script></body></html>
